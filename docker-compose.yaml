services:

  db:
    image: postgres:15-alpine
    container_name: product_qa_db
    restart: always
    env_file: .env
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-product_assistant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-product_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 5

  selenium:
    image: selenium/standalone-chrome:latest
    container_name: product_qa_selenium
    network_mode: host
    restart: always
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/wd/hub/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
    develop:
      watch:
        paths:
          - action: sync
            path: .
            target: /app
            ignore:
              - .git
              - __pycache__
              - .pytest_cache
              - .mypy_cache
              - .venv
              - venv
              - env
              - .env
              - .DS_Store
          - action: rebuild
            path: ./requirements.txt
    container_name: product_qa_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      selenium:
        condition: service_healthy
    env_file: .env
    ports:
      - "8000:80"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-product_assistant}
      - WEB_CONCURRENCY=1
      - PRODUCTS_WEBSITE_URL=${PRODUCTS_WEBSITE_URL}
      - SCRAPER_TYPE=${SCRAPER_TYPE:-selenium}
      - PRODUCT_PATHS=${PRODUCT_PATHS:-}
      - QWEN_API_URL=${QWEN_API_URL}
      - QWEN_MODEL_NAME=${QWEN_MODEL_NAME:-Qwen3.6-35B-A3B}
      - SELENIUM_URL=${SELENIUM_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s

  bot:
    build:
      context: .
    container_name: product_qa_bot
    restart: always
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@127.0.0.1:5432/${DB_NAME:-product_assistant}
      - FASTAPI_URL=http://127.0.0.1:8000/api/update
    entrypoint: ["python", "bot_main.py"]

volumes:
  postgres_data:
